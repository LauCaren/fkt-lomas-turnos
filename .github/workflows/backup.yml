name: Backup diario de la base

# Corre desatendido todos los días a las 06:00 UTC (03:00 en Argentina) contra la base de
# producción. Queda inactivo hasta que se carguen los secrets de abajo en
# Settings → Secrets and variables → Actions del repo — sin ellos el job falla rápido en el
# primer paso (los ": ${VAR:?...}" del script), no en silencio. También se puede disparar a
# mano desde la pestaña Actions con "Run workflow" para probarlo.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente de Postgres y aws-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli
      - name: Correr backup
        run: bash scripts/backup-db.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_S3_BUCKET: ${{ secrets.STORAGE_S3_BUCKET }}
          STORAGE_S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
          STORAGE_S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
          STORAGE_S3_ENDPOINT: ${{ secrets.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_REGION: ${{ secrets.STORAGE_S3_REGION }}
