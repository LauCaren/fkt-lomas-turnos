name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fkt-turnos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fkt-turnos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fkt-turnos-frontend/package-lock.json
      - name: Install dependencies
        # ELECTRON_SKIP_BINARY_DOWNLOAD: este job solo lintea/testea/buildea el bundle
        # web (src/), nunca abre Electron — evita bajar sus ~100MB de binario sin falta.
        # Los scripts de instalación quedan habilitados igual (a diferencia de npm en la
        # PC local) porque esbuild/rollup los necesitan para colocar su binario nativo;
        # el runner de CI es efímero, así que el riesgo que allowScripts mitiga localmente no aplica acá.
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
