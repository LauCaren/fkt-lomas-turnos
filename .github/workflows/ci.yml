name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita todo el historial, no solo el último commit
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          # go.sum/etc no aplica acá, pero limitar el escaneo a los manifiestos reales
          # (pom.xml, package-lock.json) evita falsos positivos sobre node_modules/target
          # si alguna vez quedan sin gitignorear en el runner.
          skip-dirs: fkt-turnos-frontend/node_modules,fkt-turnos-backend/target,fkt-turnos-frontend/dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fkt-turnos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: ./mvnw -B test
      - name: Static analysis (SpotBugs)
        run: ./mvnw -B spotbugs:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        # Solo build, sin push — el objetivo es que un Dockerfile roto (una dependencia que
        # falta en la imagen final, un multi-stage mal armado) se note acá y no recién al
        # intentar desplegar.
        run: docker build -t fkt-turnos-backend:ci fkt-turnos-backend
      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fkt-turnos-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true # una CVE sin fix disponible todavía no es algo que este repo pueda arreglar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fkt-turnos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fkt-turnos-frontend/package-lock.json
      - name: Install dependencies
        # ELECTRON_SKIP_BINARY_DOWNLOAD: este job solo lintea/testea/buildea el bundle
        # web (src/), nunca abre Electron — evita bajar sus ~100MB de binario sin falta.
        # Los scripts de instalación quedan habilitados igual (a diferencia de npm en la
        # PC local) porque esbuild/rollup los necesitan para colocar su binario nativo;
        # el runner de CI es efímero, así que el riesgo que allowScripts mitiga localmente no aplica acá.
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
