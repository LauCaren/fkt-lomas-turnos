services:
  db:
    image: postgres:16-alpine
    container_name: fkt-turnos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fkt_turnos
      POSTGRES_USER: fkt
      POSTGRES_PASSWORD: fkt
    ports:
      # Solo en la propia PC (127.0.0.1): sin esto Docker publica el puerto en todas las
      # interfaces y cualquiera en la misma red (el wifi del consultorio) podía conectarse a la
      # base con el usuario/clave de desarrollo.
      - "127.0.0.1:5433:5432"
    volumes:
      - fkt_turnos_pgdata:/var/lib/postgresql/data

volumes:
  fkt_turnos_pgdata:
