server:
  port: ${SERVER_PORT:8080}
  # "none" (default) = comportamiento de siempre, correcto para correr el backend expuesto
  # directamente (como en dev). Si en producción hay un proxy/CDN delante (load balancer,
  # nginx, Cloudflare, etc.) terminando TLS, poner FORWARDED_HEADERS_STRATEGY=native: Tomcat
  # empieza a confiar en X-Forwarded-For para request.getRemoteAddr() — de donde
  # RateLimitingFilter saca la IP para limitar login/registro/etc. Sin esto detrás de un
  # proxy real, TODO el tráfico externo se ve con la misma IP (la del proxy) y el límite por
  # IP deja de servir. "native" solo confía en el header cuando la conexión entrante viene de
  # un rango de IP privado (default de Spring Boot para server.tomcat.remoteip.internal-proxies)
  # — no alcanza con que cualquiera mande el header a mano desde afuera.
  forward-headers-strategy: ${FORWARDED_HEADERS_STRATEGY:none}

spring:
  application:
    name: fkt-turnos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fkt_turnos}
    username: ${DB_USERNAME:fkt}
    password: ${DB_PASSWORD:fkt}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    # Spring Boot 4 usa Jackson 3, que cambió varios defaults (ordena las propiedades
    # alfabéticamente, falla con null en campos primitivos, etc.). Esto mantiene el JSON
    # de la API igual que con Jackson 2 — el frontend y los snapshots de auditoría ya
    # guardados en la base dependen de ese formato.
    use-jackson2-defaults: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    # Los tres orígenes locales de desarrollo: la app web (5173), el sitio de
    # marketing estático (5500) y la app de escritorio Electron, que sirve su
    # propio build en un puerto fijo (43117, ver fkt-turnos-frontend/electron/main.cjs).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5500,http://localhost:43117}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # URL pública del backend, para que Mercado Pago pueda pegarle al webhook de confirmación
  # de pago (ver MercadoPagoService) — tiene que ser https en producción. Vacío en dev: no
  # hace falta para probar la creación de la preferencia, solo para recibir la confirmación.
  backend-url: ${BACKEND_URL:}
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-change-in-prod-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  google:
    # ID de cliente OAuth de Google Cloud Console (Credentials > OAuth client ID > Web
    # application) — el mismo valor va también en VITE_GOOGLE_CLIENT_ID del frontend. Sin
    # esto configurado, "Iniciar sesión con Google" queda deshabilitado (ver
    # GoogleTokenVerifierService.habilitado()) — mismo criterio fail-closed que Mercado Pago.
    client-id: ${GOOGLE_CLIENT_ID:}
  mfa:
    # Clave AES de 256 bits en Base64 para encriptar el secreto TOTP en la base
    # (ver MfaSecretConverter). Generar una propia para producción, por ejemplo:
    # openssl rand -base64 32
    encryption-key: ${MFA_ENCRYPTION_KEY:changeme-dev-mfa-key-change-in-prod-please}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:fernando@fktlomas.com}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:cambiar-esta-clave}
    notify-email: ${ADMIN_NOTIFY_EMAIL:fernando@fktlomas.com}
  demo-data:
    # Carga pacientes/turnos/caja/etc de ejemplo al arrancar (ver DemoDataSeeder) — SOLO para
    # desarrollo local, nunca activar en producción. Apagado por defecto a propósito.
    enabled: ${DEMO_DATA_ENABLED:false}
  mail:
    from: ${MAIL_FROM:no-reply@fktlomas.com}
    enabled: ${MAIL_ENABLED:false}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  storage:
    # "local" (default, disco en UPLOADS_DIR) o "s3" (bucket S3-compatible — AWS S3 o
    # Cloudflare R2 — obligatorio en cualquier host con disco efímero). Ver S3FileStorageService.
    type: ${STORAGE_TYPE:local}
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:auto}
      # Vacío para AWS S3 real. Para R2: https://<account_id>.r2.cloudflarestorage.com
      endpoint: ${STORAGE_S3_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
  # Solo WhatsApp usa Twilio — el canal SMS se sacó del sistema.
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    numero-origen-whatsapp: ${TWILIO_NUMERO_ORIGEN_WHATSAPP:}
    # URL pública (https) contra la que Twilio firmó el webhook entrante del bot — tiene que
    # ser exactamente la URL configurada como "when a message comes in" en la consola de
    # Twilio, sin barra final (ver TwilioSignatureVerifier). Vacío en dev: el bot rechaza todo
    # mensaje entrante hasta configurarla, igual que MERCADOPAGO_WEBHOOK_SECRET vacío rechaza
    # los webhooks de pago.
    webhook-base-url: ${TWILIO_WEBHOOK_BASE_URL:}
  recordatorios:
    # Frecuencia del polling del scheduler (minutos) — a diferencia de la
    # plantilla del mensaje y las horas de anticipación, esto NO es editable
    # desde el panel (ver RecordatorioService).
    intervalo-minutos: ${RECORDATORIOS_INTERVALO_MINUTOS:15}
  seguridad:
    # Ventana horaria "normal" de login del personal de oficina (ADMIN/SECRETARIA/CONTADOR,
    # hora de Argentina) — fuera de este rango, AuthService avisa por mail al admin. No bloquea
    # el login, solo alerta (ver AuthService.alertarLoginFueraDeHorarioSiCorresponde).
    horario-inicio: ${SEGURIDAD_HORARIO_INICIO:07:00}
    horario-fin: ${SEGURIDAD_HORARIO_FIN:21:00}
    # Chequea contraseñas nuevas contra la API pública "Pwned Passwords" de HaveIBeenPwned
    # (k-anonymity, no requiere API key ni manda la contraseña real) — ver PasswordFiltradaService.
    # Apagar solo si el host no tiene salida a internet; sin conexión igual falla "abierto" (deja
    # pasar la contraseña) en vez de romper el registro/cambio de contraseña.
    chequeo-password-filtrada: ${CHEQUEO_PASSWORD_FILTRADA:true}
  mercadopago:
    # Sin access-token configurado, el pago online al reservar queda deshabilitado (ver
    # MercadoPagoService.habilitado()) y el paciente solo puede pagar en el consultorio, como
    # hoy — no rompe nada dejarlo vacío. Alta en el panel de Mercado Pago > Tus integraciones.
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    # Firma secreta del webhook (Tus integraciones > Webhooks > Configurar notificaciones) —
    # valida que la notificación de pago venga realmente de Mercado Pago y no de cualquiera
    # que le pegue a la URL pública del webhook (ver MercadoPagoService.validarFirma).
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

springdoc:
  # Apagado por defecto — mismo criterio "fail-closed" que JWT_SECRET/MFA_ENCRYPTION_KEY/
  # ADMIN_BOOTSTRAP_PASSWORD: no hay perfiles de Spring en este proyecto (todo se resuelve por
  # env var), así que si alguna vez se despliega sin terminar de configurar todo, el olvido
  # tiene que dejar la app más cerrada, no más abierta. Antes el default era "true" (con un
  # comentario que decía lo contrario) — cualquier deploy que no seteara SWAGGER_ENABLED=false
  # a mano quedaba exponiendo el spec completo de la API (paths, DTOs, hasta los endpoints de
  # admin) sin querer. En dev, activarlo a mano con SWAGGER_ENABLED=true (ver .env.example).
  # Cuando está en false, springdoc no registra ni el JSON de /v3/api-docs ni la UI de /docs: no
  # hace falta bloquearlo aparte en SecurityConfig, esas rutas simplemente no existen.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs

management:
  # Solo health/info quedan expuestos — nada de env, beans, heapdump, etc. (que sí
  # filtran detalles internos). show-details=never porque /actuator/health es público
  # (lo pega cualquier orquestador/host para saber si reiniciar el contenedor), no queremos
  # que devuelva el estado de la conexión a la base o el disco a quien no está autenticado.
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # El indicador de mail por defecto intenta conectarse al SMTP configurado y marca
    # DOWN toda la salud del servicio si falla — rompe el health check con MAIL_ENABLED=false
    # (sin SMTP, a propósito) o incluso con un SMTP real que tenga un hipo momentáneo,
    # que no debería tirar abajo el resto de la app. Ver MAIL_ENABLED en application.yml.
    mail:
      enabled: false
