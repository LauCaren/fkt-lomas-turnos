server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fkt-turnos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fkt_turnos}
    username: ${DB_USERNAME:fkt}
    password: ${DB_PASSWORD:fkt}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-change-in-prod-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:fernando@fktlomas.com}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:cambiar-esta-clave}
    notify-email: ${ADMIN_NOTIFY_EMAIL:fernando@fktlomas.com}
  mail:
    from: ${MAIL_FROM:no-reply@fktlomas.com}
    enabled: ${MAIL_ENABLED:false}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /docs
