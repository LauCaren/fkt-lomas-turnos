<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>FKT Lomas</title>
<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<![endif]-->
<style>
  @media only screen and (max-width:620px){
    .wrap{width:100% !important;}
    .px{padding-left:24px !important;padding-right:24px !important;}
    .h1{font-size:26px !important;line-height:32px !important;}
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F3F9F9;">
<span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">{preheader}</span>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F3F9F9;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="wrap" style="width:600px;max-width:600px;">

        <tr>
          <td class="px" style="padding:0 40px 18px 40px;font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:24px;font-weight:bold;color:#1C3240;">
            FKT Lomas
            <span style="display:block;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1.4px;font-weight:normal;text-transform:uppercase;color:#6D8089;padding-top:4px;">Fisio Kinesio Terapia</span>
          </td>
        </tr>

        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #DFEAEA;border-radius:16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
              <tr><td style="background-color:{colorBarra};height:4px;line-height:4px;font-size:0;border-radius:16px 16px 0 0;">&nbsp;</td></tr>

              <tr>
                <td class="px" style="padding:36px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1.6px;text-transform:uppercase;color:#186F6C;font-weight:bold;">
                  {eyebrow}
                </td>
              </tr>
              <tr>
                <td class="px h1" style="padding:12px 40px 0 40px;font-family:Georgia,'Times New Roman',serif;font-size:29px;line-height:36px;color:#1C3240;mso-line-height-rule:exactly;">
                  {titulo}
                </td>
              </tr>
              <tr>
                <td class="px" style="padding:14px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#3D5566;mso-line-height-rule:exactly;">
                  {cuerpo}
                </td>
              </tr>

              {detalle}

              <tr>
                <td class="px" style="padding:26px 40px 0 40px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:auto;">
                    <tr>
                      <td align="center" bgcolor="{colorBoton}" style="background-color:{colorBoton};border-radius:8px;">
                        <a href="{botonUrl}" style="display:block;padding:14px 26px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:bold;color:#FFFFFF;text-decoration:none;mso-line-height-rule:exactly;">{botonTexto}</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr><td style="height:34px;line-height:34px;font-size:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>

        <tr>
          <td class="px" style="padding:26px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:20px;color:#6D8089;">
            <strong style="color:#1C3240;">FKT Lomas</strong> · Juan Larrea 496, Lomas de Zamora, Buenos Aires<br>
            <a href="tel:+541159505888" style="color:#186F6C;text-decoration:none;">11 5950-5888</a> ·
            <a href="https://www.fktlomas.com" style="color:#186F6C;text-decoration:none;">fktlomas.com</a>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:14px 40px 0 40px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:18px;color:#8A9BA3;">
            {pieLegal}
            <a href="{frontendUrl}/mi-cuenta" style="color:#8A9BA3;text-decoration:underline;">Cambiar tus preferencias de contacto</a>.
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
</body>
</html>
